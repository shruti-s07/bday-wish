                <button type="button" class="px-btn" id="screenPrint">&#9654; print</button>
              </div>
            </div>
            <button type="button" class="px-btn live-print" id="livePrint">&#9654; print</button>
            <div class="scanlines" aria-hidden="true"></div>
            <div class="countdown" id="countdown" aria-live="assertive"></div>
            <div class="flash" id="flash"></div>
            <div class="shot-dots" id="shotDots" aria-hidden="true"><i></i><i></i><i></i></div>
          </div>

          </div>

          <div class="machine-side">
          <div class="filters" role="radiogroup" aria-label="Photo filter">
            <button type="button" class="chip is-on" role="radio" aria-checked="true" data-filter="none">Natural</button>
            <button type="button" class="chip" role="radio" aria-checked="false" data-filter="rosy">Rosy</button>
            <button type="button" class="chip" role="radio" aria-checked="false" data-filter="vintage">Vintage</button>
            <button type="button" class="chip" role="radio" aria-checked="false" data-filter="mono">Black &amp; white</button>
          </div>

          <div class="controls">
            <button type="button" class="print-btn" id="printBtn">
              <span class="print-label">Print</span>
              <span class="print-sub">3 photos</span>
            </button>
            <button type="button" class="take-memories" id="takeMemories">take new memories</button>
          </div>
          <p class="booth-status" id="boothStatus" role="status"></p>
          </div>
          <div class="coin-door" aria-hidden="true"><i></i><i></i></div>
          <div class="pb-bottom" aria-hidden="true">
            <span class="pb-pill pb-pill-long"></span>
            <span class="pb-icons">
              <svg viewBox="0 0 16 16"><path d="M2 8 L8 2.5 L14 8 V14 H10 V10 H6 V14 H2 Z" fill="currentColor"/></svg>
              <svg viewBox="0 0 16 16"><path d="M8 15 C8 15 3 9.5 3 6.2 a5 5 0 0 1 10 0 C13 9.5 8 15 8 15 Z" fill="currentColor"/><circle cx="8" cy="6.2" r="1.8" fill="var(--pb-bar)"/></svg>
              <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-dasharray="2.2 1.9"/><circle cx="8" cy="8" r="3.4" fill="currentColor"/><circle cx="8" cy="8" r="1.4" fill="var(--pb-bar)"/></svg>
              <svg viewBox="0 0 16 16"><path d="M5.5 1.5 H10.5 L9.5 6 L12.5 9 H3.5 L6.5 6 Z" fill="currentColor"/><path d="M8 9 V15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              <svg viewBox="0 0 16 16"><path d="M2.5 4 H13.5 M2.5 8 H13.5 M2.5 12 H13.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </span>
            <span class="pb-tail"><span class="pb-slider"><i></i></span><span class="pb-dots"><i></i><i></i><i></i></span></span>
          </div>
        </div>

        <div class="tray">
          <div class="slot" aria-hidden="true"><span class="slot-mouth"></span></div>
          <div class="strip-window" id="stripWindow">
            <div class="strip-placeholder" id="stripPlaceholder">
            </div>
            <img id="stripImg" alt="Your printed photostrip of three photos" hidden>
          </div>
          <div class="tray-actions">
            <button type="button" class="btn btn-solid" id="downloadBtn" disabled>Download strip</button>
          </div>
        </div>
      </div>

      <a class="scroll-cue" href="#letters" aria-label="Go to the letters">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </section>

    <!-- ============ DASHBOARD 3: LETTERS ============ -->
    <section id="letters" class="panel letters">

      <div class="mailbox" id="mailbox"></div>

      <footer class="finale">
        <button type="button" class="btn btn-ghost" id="backTop">Back to the top</button>
      </footer>
    </section>
 </main>

  <dialog class="letter-dialog" id="letterDialog" aria-labelledby="letterTitle">
    <article class="paper">
      <div class="win-body">
        <button type="button" class="paper-close" id="letterClose" aria-label="Close letter">&times;</button>
        <p class="paper-tag" id="letterTag"></p>
        <h3 class="paper-title" id="letterTitle"></h3>
        <div class="paper-body" id="letterBody"></div>
      </div>
    </article>
  </dialog>

  <!-- Cute mode: unlock box, then the letter, in the launch pop-up style -->
  <dialog class="pixel-dialog" id="lockDialog" aria-labelledby="lockTitle">
    <div class="launch-win pixel-win">
      <div class="launch-bar">
        <span class="launch-hearts" aria-hidden="true"></span>
        <span class="pw-file" id="pwFile"></span>
        <button type="button" class="launch-x" id="lockX" aria-label="Close"></button>
      </div>
      <form class="lock-form" id="lockForm" autocomplete="off">
        <p class="lock-title" id="lockTitle"></p>
        <label class="sr-only" for="lockInput">Unlock phrase</label>
        <input type="text" id="lockInput" class="lock-input" spellcheck="false" autocapitalize="off" autocomplete="off">
        <p class="lock-msg" id="lockMsg" role="status"></p>
        <button type="submit" class="launch-go" aria-label="Unlock letter"><span class="launch-heart" aria-hidden="true"></span></button>
      </form>
      <div class="pw-letter" id="pwLetter" hidden>
        <p class="pw-tag" id="pwTag"></p>
        <h3 class="pw-title" id="pwTitle"></h3>
        <div class="pw-body" id="pwBody"></div>
      </div>
    </div>
  </dialog>
 
  <!-- Pretty mode: retro "System message" pop-up, used for launching and for unlocking letters -->
  <dialog class="sys-dialog" id="sysDialog" aria-labelledby="sysMsg">
    <form class="sys-win" id="sysForm" autocomplete="off">
      <div class="sys-bar">
        <span>System message</span>
        <button type="button" class="sys-x" id="sysX" aria-label="Close">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2 L8 8 M8 2 L2 8" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>
      <div class="sys-body">
        <p class="sys-msg" id="sysMsg"></p>
        <label class="sr-only" for="sysInput">Phrase</label>
        <input type="text" id="sysInput" class="sys-input" spellcheck="false" autocapitalize="off" autocomplete="off" hidden>
        <p class="sys-err" id="sysErr" role="status"></p>
        <button type="submit" class="sys-ok" id="sysOk">Ok</button>
      </div>
    </form>
  </dialog>

  <script src="memories.js"></script>
  <script src="script.js"></script>
</body>
</html>
